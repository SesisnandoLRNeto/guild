<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17121c">
<title>Quest Console</title>
<style>
  /* The quest console: read a session and type to it, from the phone. */
  :root { --bg: #17121c; --card: #241d2b; --line: #4a3f52; --ink: #efe6d8; --dim: #a89c8c; --gold: #e0b84a;
          --red: #ff7a66; --yellow: #f0c75a; --blue: #8fb8ff; --green: #8fcf6a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 12px 16px;
           padding-top: max(12px, env(safe-area-inset-top)); background: var(--bg); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 17px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header a, header button { color: var(--gold); text-decoration: none; background: none; border: 0; font: inherit; padding: 4px 0; }
  #list { padding: 8px 16px 24px; }
  .tab { display: block; width: 100%; text-align: left; background: var(--card); color: inherit; border: 1px solid var(--line);
         border-radius: 10px; padding: 12px 14px; margin: 0 0 10px; font: inherit; cursor: pointer; }
  .tab b { display: block; font-size: 16px; word-break: break-all; }
  .tab .st { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .tab .note { display: block; font-size: 13.5px; color: var(--dim); margin-top: 4px; }
  .st.needs-decision, .st.stopped { color: var(--yellow); } .st.blocked, .st.failed { color: var(--red); }
  .st.working { color: var(--blue); } .st.done, .st.graded { color: var(--green); } .st.quartermaster { color: var(--gold); }
  #view { display: none; flex-direction: column; height: 100dvh; }
  body.open #list { display: none; } body.open #view { display: flex; }
  #screen { flex: 1; margin: 0; padding: 10px 12px; overflow: auto; white-space: pre-wrap; word-break: break-word;
            font: 12px/1.35 ui-monospace, "SF Mono", Menlo, monospace; color: #e8e2d6; background: #0f0b13; }
  #compose { border-top: 1px solid var(--line); padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); background: var(--bg); }
  .keys { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 8px; }
  .keys button { flex: none; min-width: 44px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
                 background: var(--card); color: var(--ink); font: 14px ui-monospace, Menlo, monospace; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; min-height: 44px; max-height: 40vh; resize: none; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
             background: #0f0b13; color: var(--ink); font-size: 16px; line-height: 1.35; font-family: inherit; }   /* 16px: iOS does not zoom in */
  #send { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--gold); color: #241a08; font-size: 16px; font-weight: 600; font-family: inherit; }
  #send:disabled { opacity: .5; }
  #msg { font-size: 13px; color: var(--dim); min-height: 18px; margin-top: 4px; }
  #msg.err { color: var(--red); }
  .empty { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<section id="list">
  <header style="margin:0 -16px 10px"><h1>Quest console</h1><a href="/">Docket</a></header>
  <div id="tabs"><p class="empty">Loading…</p></div>
</section>
<section id="view">
  <header><button type="button" id="back" aria-label="Back to the list">‹ Quests</button><h1 id="title"></h1><a id="board" href="/">Docket</a></header>
  <pre id="screen" aria-live="polite"></pre>
  <div id="compose">
    <div class="keys" aria-label="Keys for prompts">
      <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
      <button type="button" data-key="enter">Enter</button><button type="button" data-key="esc">Esc</button>
      <button type="button" data-key="up">↑</button><button type="button" data-key="down">↓</button>
      <button type="button" data-key="y">y</button><button type="button" data-key="n">n</button>
    </div>
    <div class="row">
      <textarea id="text" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <button type="button" id="send">Send</button>
    </div>
    <div id="msg"></div>
  </div>
</section>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const STATE = { "needs-decision": "waits on you", blocked: "blocked", failed: "failed", stopped: "stopped",
                working: "working", done: "done", graded: "graded", quartermaster: "quartermaster" };
let tab = "", timer = null, listTimer = null;

async function loadList() {
  try {
    const d = await (await fetch("/console.json", { cache: "no-store" })).json();
    $("#tabs").innerHTML = d.tabs.map((t) => `<button type="button" class="tab" data-tab="${esc(t.name)}">
      <b>${esc(t.name)}</b><span class="st ${esc(t.state)}">${esc(STATE[t.state] || t.state)}</span>
      ${t.note ? `<span class="note">${esc(t.note)}</span>` : ""}</button>`).join("")
      || `<p class="empty">No tabs open. Start the guild on the Mac with guild up.</p>`;
  } catch (e) { $("#tabs").innerHTML = `<p class="empty">Cannot reach the war table.</p>`; }
}

function nearBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 60; }

async function loadScreen() {
  if (!tab) return;
  const el = $("#screen"), stick = nearBottom(el) || !el.textContent;
  try {
    const d = await (await fetch(`/console/screen?tab=${encodeURIComponent(tab)}&n=120`, { cache: "no-store" })).json();
    if (d.error) { say(d.error, true); return; }
    if (el.textContent !== d.screen) { el.textContent = d.screen; if (stick) el.scrollTop = el.scrollHeight; }
  } catch (e) { say("Cannot reach the war table.", true); }
}

function say(t, err) { const m = $("#msg"); m.textContent = t; m.className = err ? "err" : ""; }

function show(name) {
  tab = name; document.body.classList.add("open"); $("#title").textContent = name;
  $("#screen").textContent = ""; say("");
  clearInterval(listTimer); clearInterval(timer); loadScreen(); timer = setInterval(loadScreen, 3000);
}
function hide() {
  tab = ""; document.body.classList.remove("open"); clearInterval(timer);
  loadList(); listTimer = setInterval(loadList, 10000);
}

async function post(body) {
  const r = await fetch("/console/send", { method: "POST", headers: { "X-Guild": "console", "Content-Type": "application/json" },
                                           body: JSON.stringify(Object.assign({ tab }, body)) });
  return r.json();
}

$("#tabs").addEventListener("click", (ev) => { const b = ev.target.closest("[data-tab]"); if (b) location.hash = b.dataset.tab; });
$("#back").addEventListener("click", () => { location.hash = ""; });
window.addEventListener("hashchange", route);
function route() { const h = decodeURIComponent(location.hash.slice(1)); h ? show(h) : hide(); }

$("#send").addEventListener("click", async () => {
  const t = $("#text"), text = t.value.trim();
  if (!text) return;
  $("#send").disabled = true; say("Sending…");
  try {
    const d = await post({ text });
    if (d.error) say(d.error, true); else { t.value = ""; grow(); say("Sent."); setTimeout(loadScreen, 800); }
  } catch (e) { say("Not sent: cannot reach the war table.", true); }
  $("#send").disabled = false;
});
document.querySelector(".keys").addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-key]"); if (!b) return;
  const d = await post({ key: b.dataset.key });
  say(d.error || d.did, !!d.error); setTimeout(loadScreen, 500);
});
function grow() { const t = $("#text"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, innerHeight * .4) + "px"; }
$("#text").addEventListener("input", grow);
$("#text").addEventListener("keydown", (ev) => {   // a hardware keyboard: Cmd/Ctrl+Enter sends
  if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); $("#send").click(); }
});
route();
</script>
</body>
</html>
