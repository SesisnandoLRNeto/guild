<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>war table</title>
<style>
  :root { --bg: #0f1117; --panel: #161922; --line: #242835; --text: #e6e8ef; --dim: #9aa3b8; --accent: #7aa2f7; --ok: #7dcfa0; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7fa; --panel: #fff; --line: #e2e5ec; --text: #1b1f2a; --dim: #5c6478; --accent: #3a63c8; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: var(--dim); margin: 0 0 24px; }
  ul.boards { list-style: none; padding: 0; margin: 0; }
  ul.boards li { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  ul.boards li.waiting { border-left: 3px solid var(--accent); }
  ul.boards li.answered { opacity: .6; }
  ul.boards a { color: var(--text); text-decoration: none; font-weight: 600; }
  ul.boards a:hover { color: var(--accent); }
  .meta { display: block; color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; margin-top: 2px; }
  li.empty { color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>War table</h1>
  <p class="sub">Boards your adventurers put up. The ones on the left border are waiting for you.</p>
  <!--BOARDS-->
</div>
</body>
</html>
