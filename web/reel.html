<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest reel</title>
<style>
  :root { --bg: #0d0b12; --ink: #e9dcc0; --dim: #a39579; --gold: #d9a441; --line: #3a3142; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Georgia, "Iowan Old Style", serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 40px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  header a { color: var(--gold); text-decoration: none; font-size: 14px; }
  h1 { font-variant: small-caps; letter-spacing: .06em; font-size: 22px; margin: 0; color: var(--gold); }
  .sub { color: var(--dim); font-size: 14px; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 2px solid #8a6a1e;
           box-shadow: 0 0 0 4px #1b1622, 0 18px 40px rgba(0, 0, 0, .6); }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  button, select { font: inherit; font-size: 14px; color: var(--ink); background: #1f1926; border: 1px solid var(--line);
                   border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.main { background: #3a2a10; border-color: #8a6a1e; color: #f3cf6c; }
  label { font-size: 14px; color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  .grow { flex: 1; }
  .scenes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .scenes button { font-size: 12px; padding: 3px 9px; }
  .scenes button.on { border-color: var(--gold); color: #f3cf6c; }
  .note { color: var(--dim); font-size: 13px; margin-top: 10px; }
  .err { color: #e0573f; }
</style></head>
<body><main>
<header><a href="javascript:history.back()">&larr; back</a><h1 id="title">Quest reel</h1><span class="sub" id="sub"></span></header>
<div class="stage"><canvas id="out" width="1280" height="720"></canvas></div>
<div class="bar">
  <button id="prev" title="Previous scene (left arrow)">&#9664;&#9664;</button>
  <button id="play" class="main" title="Play or pause (space)">Pause</button>
  <button id="next" title="Next scene (right arrow)">&#9654;&#9654;</button>
  <button id="again" title="From the start">From the start</button>
  <label><input type="checkbox" id="voice"> Narrator voice</label>
  <label>Speed <select id="speed"><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select></label>
  <span class="grow"></span>
  <button id="rec" title="Plays the reel from the start and saves it as a .webm video">Save as video</button>
</div>
<div class="scenes" id="scenes"></div>
<p class="note" id="note">Space plays or pauses, the arrows move between scenes. The video file has the pictures and the captions; the narrator voice stays in the browser.</p>
</main>
<script>
"use strict";
// ── the stage: art is drawn at 320x180 and blown up 4x, so every pixel is a block ──
const W = 320, H = 180, ART_H = 140;
const out = document.getElementById("out"), octx = out.getContext("2d");
const art = document.createElement("canvas"); art.width = W; art.height = H;
const ctx = art.getContext("2d");
octx.imageSmoothingEnabled = false;

// ── a 3x5 pixel font, so words belong to the picture ──
const GLYPH = {
  A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",
  G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",
  M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101111011",R:"110101110101101",
  S:"011100010001110",T:"111010010010010",U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",
  Y:"101101010010010",Z:"111001010100111","0":"111101101101111","1":"010110010010111","2":"110001010100111",
  "3":"110001010001110","4":"101101111001001","5":"111100110001110","6":"011100111101111","7":"111001010010010",
  "8":"111101111101111","9":"111101111001110"," ":"000000000000000",".":"000000000000010",",":"000000000010100",
  ":":"000010000010000",";":"000010000010100","-":"000000111000000","+":"000010111010000","#":"010111010111010",
  "!":"010010010000010","?":"110001010000010","/":"001001010100100","(":"010100100100010",")":"010001001001010",
  "'":"010010000000000",'"':"101101000000000","_":"000000000000111","=":"000111000111000","%":"101001010100101",
  "&":"010101010101011","*":"000101010101000","<":"001010100010001",">":"100010001010100","@":"010101111100011"
};
function px(text, x, y, color, s = 1) {
  ctx.fillStyle = color;
  let cx = x;
  for (const ch of String(text).toUpperCase()) {
    const g = GLYPH[ch] || GLYPH["?"];
    for (let i = 0; i < 15; i++) if (g[i] === "1") ctx.fillRect(cx + (i % 3) * s, y + Math.floor(i / 3) * s, s, s);
    cx += 4 * s;
  }
  return cx;
}
function wrap(text, chars) {
  const words = String(text || "").split(/\s+/).filter(Boolean), lines = [];
  let line = "";
  for (const w of words) {
    if ((line + " " + w).trim().length > chars) { if (line) lines.push(line); line = w.length > chars ? w.slice(0, chars - 1) + "-" : w; }
    else line = (line + " " + w).trim();
  }
  if (line) lines.push(line);
  return lines;
}
const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
// a seeded random, so stars and sparks sit still between frames
const rnd = seed => { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };

// ── sprites: rows of palette letters, "." is empty ──
const HERO = [
  "...HHHH...", "..HHHHHH..", ".HHHHHHHH.", "..SSSSSS..", "..SESSES..", "..SSSSSS..", "...SMMS...",
  "..BBBBBB..", ".SBBGGBBS.", ".SBBBBBBS.", "..BBBBBB..", "..LL..LL..", "..LL..LL..", "..FF..FF.."];
const HERO_STEP = [
  "...HHHH...", "..HHHHHH..", ".HHHHHHHH.", "..SSSSSS..", "..SESSES..", "..SSSSSS..", "...SMMS...",
  "..BBBBBB..", ".SBBGGBBS.", ".SBBBBBBS.", "..BBBBBB..", "..LL..LL..", ".LL....LL.", ".FF....FF."];
const DRAGON = [
  "..R......R..", "..RR....RR..", "...RRRRRR...", "..RRRRRRRR..", "..RYRRRRYR..", "..RRRRRRRR..", "...RKKKKR...",
  "..RRRRRRRR.W", ".RRRGGGGRRWW", "RRRRGGGGRRW.", "R.RRRRRRRR..", "...RR..RR...", "..RR....RR..", "..KK....KK.."];
const GOBLIN = [
  "G........G", "GG.GGGG.GG", ".GGGGGGGG.", ".GRGGGGRG.", ".GGGGGGGG.", "..GKKKKG..", "...GGGG...",
  "..BBBBBB..", ".GBBBBBBG.", "..BBBBBB..", "..GG..GG..", "..KK..KK.."];
const RACES = {   // hat, skin, body, belt, legs, feet, extra
  human:   { H: "#6b3f1f", S: "#f1c9a0", B: "#3f6fb5", G: "#d9a441", L: "#3b2f4a", F: "#2a1f17" },
  highelf: { H: "#e9dcc0", S: "#f6dcc2", B: "#3b5fc4", G: "#f3cf6c", L: "#2c3a7a", F: "#1f1a2e" },
  dwarf:   { H: "#9aa3b0", S: "#e8b48a", B: "#8a4b12", G: "#d9a441", L: "#4a3424", F: "#2a1f17", M: "#c56a1f" },
  gnome:   { H: "#3f9b4a", S: "#f4c9a5", B: "#c0582f", G: "#f3cf6c", L: "#5a4a2e", F: "#2a1f17" },
  dragon:  { R: "#c8382c", Y: "#f3cf6c", K: "#5a1410", G: "#f08a3c", W: "#e0573f" }
};
function sprite(rows, pal, x, y, s = 1, flip = false) {
  const base = { E: "#1b1220", M: pal.M || pal.S || "#000", K: pal.K || "#2a1f17" };
  rows.forEach((row, j) => [...row].forEach((c, i) => {
    if (c === ".") return;
    ctx.fillStyle = pal[c] || base[c] || "#ff00ff";
    ctx.fillRect(Math.round(x + (flip ? row.length - 1 - i : i) * s), Math.round(y + j * s), s, s);
  }));
}
function hero(race, x, y, t, s = 1, walking = false, flip = false) {
  if (race === "dragon") return sprite(DRAGON, RACES.dragon, x, y + (walking ? Math.round(Math.sin(t * 10)) : 0), s, flip);
  const pal = RACES[race] || RACES.human;
  const frame = walking && Math.floor(t * 6) % 2 ? HERO_STEP : HERO;
  sprite(frame, pal, x, y, s, flip);
}
const goblin = (x, y, t, s = 1) => sprite(GOBLIN, { G: "#5f9b3a", R: "#e0573f", B: "#6b4a2a", K: "#2a1f17" }, x, y + Math.round(Math.sin(t * 8)), s);

// ── shared scenery ──
function sky(top, bottom) { for (let y = 0; y < ART_H; y += 4) { const k = y / ART_H; rect(0, y, W, 4, mix(top, bottom, k)); } }
function mix(a, b, k) {
  const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, "0")).join("");
}
function ground(c1, c2, y = 118) { rect(0, y, W, ART_H - y, c1); for (let x = 0; x < W; x += 8) rect(x + ((x / 8) % 2) * 4, y, 4, 2, c2); }
function stars(seed, t, n = 40) { const r = rnd(seed); for (let i = 0; i < n; i++) { const x = r() * W, y = r() * 90, tw = Math.sin(t * 3 + i) > 0.6; rect(x, y, 1, 1, tw ? "#fff6d0" : "#8f86b8"); } }
function heading(text) { rect(0, 0, W, 14, "rgba(0,0,0,.45)"); px(text, 6, 5, "#f3cf6c"); }
function panel(x, y, w, h, fill, edge) { rect(x, y, w, h, edge); rect(x + 1, y + 1, w - 2, h - 2, fill); }

// ── the scenes ──
const DRAW = {
  title(sc, t) {
    sky("#0d1030", "#2a1f4a"); stars(7, t, 60);
    ctx.fillStyle = "#f3e7c9"; ctx.beginPath(); ctx.arc(272, 26, 8, 0, 6.3); ctx.fill();   // the moon
    ctx.fillStyle = "#14123a"; ctx.beginPath(); ctx.arc(276, 23, 7, 0, 6.3); ctx.fill();
    for (const [x, h] of [[230, 40], [246, 58], [262, 46], [278, 62], [294, 44]]) rect(x, 118 - h, 14, h, "#151027");
    for (const x of [233, 249, 281]) rect(x, 118 - 70 + 30, 4, 6, Math.sin(t * 2 + x) > 0 ? "#f3cf6c" : "#a06a1a");
    ground("#1d2a1a", "#2c3f22");
    const big = String(sc.title || "").toUpperCase().slice(0, 18), bw = big.length * 8;
    px(big, Math.round((W - bw) / 2), 34, "#f3cf6c", 2);
    wrap(sc.sub, 70).slice(0, 3).forEach((l, i) => px(l, Math.round((W - l.length * 4) / 2), 58 + i * 8, "#e9dcc0"));
    const x = Math.min(140, -24 + t * 60);
    hero(R.hero, x, 90, t, 2, x < 140);
    if (x >= 140) px(R.klass || "", x + 10 - (R.klass || "").length * 2, 82, "#a39579");
  },
  pain(sc, t) {
    sky("#22142a", "#2e1c33");
    rect(0, 96, W, 22, "#3a2433");                                                   // the desk wall
    rect(140, 96, 110, 6, "#6b4a2a"); rect(146, 102, 4, 16, "#4a3424"); rect(240, 102, 4, 16, "#4a3424");
    panel(160, 58, 70, 38, "#101820", "#5a6070");                                    // the screen
    for (let i = 0; i < 4; i++) rect(166, 64 + i * 7, 40 + (i * 9) % 18, 4, i === 1 && Math.floor(t * 3) % 2 ? "#e0573f" : "#3a5a7a");
    rect(190, 96, 10, 4, "#5a6070");
    ground("#2a1f2a", "#3a2a3a");
    hero("human", 112, 90, t, 2);
    const by = 66 + Math.round(Math.sin(t * 5) * 2);                                 // the "!" bubble
    panel(130, by, 14, 14, "#f3e7c9", "#e0573f"); px("!", 136, by + 4, "#e0573f");
    const r = rnd(3); for (let i = 0; i < 3; i++) px("?", 90 + r() * 20, 60 + ((t * 12 + i * 20) % 40), "#a39579");
    heading(sc.title || "The pain");
  },
  cause(sc, t) {
    sky("#1a1622", "#262030"); ground("#2a2430", "#363040");
    gear(110, 72, 22, t * 1.2, "#8a6a1e", false);
    gear(146, 92, 14, -t * 1.8 + 0.3, "#9aa3b0", true);
    if (Math.floor(t * 8) % 3 === 0) { const r = rnd(Math.floor(t * 8)); for (let i = 0; i < 6; i++) rect(132 + r() * 14, 78 + r() * 14, 1, 1, "#f3cf6c"); }
    const mx = 70 + ((t * 30) % 140);                                                  // the magnifier sweeps
    ctx.strokeStyle = "#e9dcc0"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(mx, 60, 12, 0, 6.3); ctx.stroke();
    rect(mx + 8, 68, 3, 10, "#6b4a2a");
    (sc.items || []).slice(0, 2).forEach((w, i) => { const f = w.split("/").pop().slice(-33); panel(176, 40 + i * 18, 140, 14, "#f3e7c9", "#8a6a1e"); px(f, 180, 45 + i * 18, "#4a2f1a"); });
    heading(sc.title || "Why it happens");
  },
  change(sc, t) {
    sky("#14121c", "#1c1828");
    const cols = [["Before", sc.before || [], "#2a2630", "#5a5464", "#8f8796"], ["After", sc.after || [], "#17241a", "#5f9b4a", "#e9f3d8"]];
    cols.forEach(([name, items, fill, edge, ink], c) => {
      const x = 8 + c * 156, show = c === 0 ? 99 : Math.floor(t / 1.4) + 1;
      panel(x, 20, 148, 116, fill, edge);
      px(name, x + 6, 25, c ? "#8fcf6a" : "#a39579");
      let y = 36;
      const list = items.length ? items : [c ? "(see the steps)" : "nothing like it yet"];
      list.slice(0, Math.min(list.length, show)).forEach(it => {
        wrap(it, 34).slice(0, 3).forEach((l, i) => { px((i ? "  " : "- ") + l, x + 4, y, ink); y += 7; });
        y += 4;
      });
    });
    const sx = 164 + ((t * 70) % 150);                                                  // a shine sweeps the new side
    for (let i = 0; i < 6; i++) rect(sx - i, 21, 1, 114, `rgba(255,246,208,${0.06 * (6 - i)})`);
    heading(sc.title || "What changes");
  },
  build(sc, t) {
    sky("#1c1210", "#2e1a12"); ground("#2a1c16", "#3a281e");
    rect(0, 40, W, 3, "#3a2418");
    const glow = 0.5 + 0.5 * Math.sin(t * 6);                                             // the forge fire
    rect(10, 90, 40, 28, "#3a2a24"); rect(16, 96, 28, 16, mix("#a0300f", "#f3a03c", glow));
    rect(150, 104, 36, 6, "#4a4e58"); rect(160, 110, 16, 8, "#3a3e48"); rect(146, 102, 10, 4, "#4a4e58");   // the anvil
    const up = Math.floor(t * 2.5) % 2 === 0;
    hero(R.hero, 120, 90, t, 2);
    rect(142, up ? 82 : 96, 3, up ? 16 : 8, "#6b4a2a"); rect(139, up ? 78 : 94, 10, 5, "#9aa3b0");
    if (!up) { const r = rnd(Math.floor(t * 2.5)); for (let i = 0; i < 8; i++) rect(150 + r() * 20, 96 + r() * 8, 1, 1, "#f3cf6c"); }
    rect(270, 104, 30, 14, "#6b3f1f"); rect(270, 100, 30, 4, "#8a5a2a"); rect(283, 106, 4, 4, "#d9a441");   // the chest
    const files = sc.files || [], n = files.length;
    files.forEach((f, i) => {                                                               // each file flies into the chest
      const k = ((t * 0.5 + i / Math.max(n, 1)) % 1);
      const x = 168 + k * 104, y = 98 - Math.sin(k * Math.PI) * 50;
      rect(x, y, 6, 8, "#f3e7c9"); rect(x + 1, y + 2, 4, 1, "#8a6a1e"); rect(x + 1, y + 4, 3, 1, "#8a6a1e");
    });
    const c = sc.count || [0, 0, 0];
    if (c[0]) { px(`${c[0]} files`, 228, 20, "#e9dcc0"); px(`+${c[1]}`, 228, 28, "#8fcf6a"); px(`-${c[2]}`, 260, 28, "#e0573f"); }
    const items = sc.items || [];
    if (items.length) {                                                                     // the step being forged
      const each = Math.max(2.2, dur(sc) / items.length), i = Math.min(items.length - 1, Math.floor(t / each));
      panel(8, 20, 214, 30, "#120c0a", "#8a5a2a");
      px(`step ${i + 1} of ${items.length}`, 12, 24, "#d9a441");
      wrap(items[i], 52).slice(0, 2).forEach((l, j) => px(l, 12, 32 + j * 7, "#e9dcc0"));
    }
    heading(sc.title || "At the forge");
  },
  trial(sc, t) {
    sky("#101622", "#18202e"); ground("#1a2230", "#24304a");
    const items = sc.items || [];
    panel(10, 20, 220, 18 + items.length * 18, "#0c1018", "#3f7fc4");
    items.forEach((it, i) => {
      const y = 28 + i * 18, shown = t > 0.8 + i * 1.3;
      panel(16, y, 10, 10, "#1a2230", "#5a6070");
      if (shown) {
        if (it.ok) { rect(18, y + 5, 2, 2, "#8fcf6a"); rect(20, y + 6, 2, 2, "#8fcf6a"); rect(22, y + 3, 2, 4, "#8fcf6a"); }
        else { for (let k = 0; k < 6; k++) { rect(18 + k, y + 2 + k, 1, 1, "#e0573f"); rect(23 - k, y + 2 + k, 1, 1, "#e0573f"); } }
      }
      px(it.what, 32, y + 1, shown ? (it.ok ? "#8fcf6a" : "#e0573f") : "#5a6070");
      px(String(it.note || "").slice(0, 45), 32, y + 8, shown ? "#a39579" : "#3a4050");
    });
    const all = items.every(i => i.ok), done = t > 0.8 + items.length * 1.3;
    if (!done || !all) goblin(270, 94, t, 2);
    else { const k = Math.min(1, (t - (0.8 + items.length * 1.3)) * 2); const r = rnd(9); for (let i = 0; i < 18; i++) rect(280 + (r() - 0.5) * 40 * k, 106 + (r() - 0.5) * 30 * k, 2, 2, "#8fcf6a"); }
    hero(R.hero, 236, 90, t, 2);
    heading(sc.title || "Proof by trial");
  },
  result(sc, t) {
    sky("#1a1430", "#3a2a4a"); stars(11, t, 30); ground("#1d2a1a", "#2c3f22");
    rect(180, 40, 120, 78, "#4a4458"); for (let x = 180; x < 300; x += 12) rect(x, 34, 8, 6, "#4a4458");   // the castle
    rect(222, 70, 36, 48, "#120c18");
    const lift = Math.min(1, t / 2) * 40;                                                     // the gate lifts
    for (let x = 224; x < 258; x += 6) rect(x, 70, 2, 48 - lift, "#6b6478");
    rect(222, 70 + 48 - lift - 2, 36, 2, "#6b6478");
    const hx = Math.min(150, 30 + t * 40);
    hero(R.hero, hx, 90, t, 2, hx < 150);
    rect(120, 104, 22, 14, "#6b3f1f"); rect(120, 100, 22, 4, "#8a5a2a"); rect(129, 106, 4, 4, "#d9a441");
    if (t > 1.5) for (let i = 0; i < 5; i++) rect(124 + i * 3, 96 - ((t * 20 + i * 7) % 12), 1, 1, "#f3cf6c");
    const label = sc.pr ? `PR #${sc.pr}` : "On the road";
    px(label, Math.round((W - label.length * 8) / 2), 20, "#f3cf6c", 2);
    if (sc.pr) { const r = rnd(5); for (let i = 0; i < 40; i++) { const x = r() * W, sp = 10 + r() * 30; rect(x, (r() * 140 + t * sp) % 140, 2, 2, ["#f3cf6c", "#8fcf6a", "#e0573f", "#7aa2f7"][i % 4]); } }
    heading(sc.title || "Back with the loot");
  },
  note(sc, t) {
    sky("#1a1622", "#262030"); ground("#2a2430", "#363040");
    panel(40, 22, 240, 100, "#f3e7c9", "#8a6a1e");
    let y = 30;
    (sc.items && sc.items.length ? sc.items : wrap(sc.say, 56)).forEach((it, i) => {
      if (t < 0.5 + i * 0.9) return;
      wrap(String(it), 56).slice(0, 2).forEach(l => { px(l, 48, y, "#4a2f1a"); y += 7; });
      y += 3;
    });
    heading(sc.title || "A note");
  }
};
function gear(cx, cy, r, a, color, broken) {
  for (let i = 0; i < 10; i++) {
    if (broken && i === 3) continue;
    const ang = a + i * Math.PI / 5;
    rect(cx + Math.cos(ang) * (r + 2) - 2, cy + Math.sin(ang) * (r + 2) - 2, 5, 5, color);
  }
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.3); ctx.fill();
  ctx.fillStyle = "#1a1622"; ctx.beginPath(); ctx.arc(cx, cy, r * 0.35, 0, 6.3); ctx.fill();
}

// ── the player ──
let R = null, at = 0, sceneT = 0, playing = true, speed = 1, last = 0, speaking = false, recorder = null;
const $ = id => document.getElementById(id);
const dur = sc => Math.max(6, (sc.say || "").length / 17 + 3);

function caption(sc, t) {
  octx.fillStyle = "rgba(10,8,14,.92)"; octx.fillRect(0, 560, 1280, 160);
  octx.fillStyle = "#8a6a1e"; octx.fillRect(0, 560, 1280, 3);
  const text = sc.say || "", shown = text.slice(0, Math.floor(t * 34));
  octx.font = "600 27px Georgia, 'Iowan Old Style', serif"; octx.fillStyle = "#f3e7c9"; octx.textBaseline = "top";
  const words = shown.split(" "), lines = []; let line = "";
  for (const w of words) { const test = line ? line + " " + w : w; if (octx.measureText(test).width > 1200) { lines.push(line); line = w; } else line = test; }
  lines.push(line);
  lines.slice(-4).forEach((l, i) => octx.fillText(l, 40, 580 + i * 34));
  R.scenes.forEach((_, i) => { octx.fillStyle = i === at ? "#f3cf6c" : i < at ? "#8a6a1e" : "#3a3142"; octx.fillRect(1280 - 24 - (R.scenes.length - i) * 20, 22, 14, 6); });
}
function frame(now) {
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 0; last = now;
  if (R) {
    const sc = R.scenes[at];
    if (playing) sceneT += dt * speed;
    ctx.clearRect(0, 0, W, H);
    (DRAW[sc.kind] || DRAW.note)(sc, sceneT);
    octx.drawImage(art, 0, 0, W, H, 0, 0, 1280, 720);
    caption(sc, sceneT);
    if (playing && sceneT >= dur(sc) && !speaking) {
      if (at < R.scenes.length - 1) go(at + 1);
      else { playing = false; $("play").textContent = "Play"; if (recorder) setTimeout(() => recorder && recorder.stop(), 600); }
    }
  }
  requestAnimationFrame(frame);
}
function go(i) {
  at = Math.max(0, Math.min(R.scenes.length - 1, i)); sceneT = 0;
  document.querySelectorAll(".scenes button").forEach((b, j) => b.classList.toggle("on", j === at));
  speak();
}
function speak() {
  speaking = false;
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  if (!$("voice").checked || !playing) return;
  const u = new SpeechSynthesisUtterance(R.scenes[at].say || "");
  u.lang = "en-US"; u.rate = Math.min(2, 0.95 * speed);
  u.onend = u.onerror = () => { speaking = false; };
  speaking = true; speechSynthesis.speak(u);
}
function toggle() { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; if (playing) speak(); else if ("speechSynthesis" in window) speechSynthesis.cancel(), speaking = false; }

$("play").onclick = toggle;
$("prev").onclick = () => go(at - 1);
$("next").onclick = () => go(at + 1);
$("again").onclick = () => { playing = true; $("play").textContent = "Pause"; go(0); };
$("voice").onchange = speak;
$("speed").onchange = e => { speed = parseFloat(e.target.value); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === " ") { e.preventDefault(); toggle(); }
  if (e.key === "ArrowRight") go(at + 1);
  if (e.key === "ArrowLeft") go(at - 1);
});
$("rec").onclick = () => {
  if (recorder) { recorder.stop(); return; }
  if (!out.captureStream || !window.MediaRecorder) { $("note").innerHTML = '<span class="err">This browser cannot record the canvas.</span>'; return; }
  const type = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(t => MediaRecorder.isTypeSupported(t));
  const chunks = [];
  recorder = new MediaRecorder(out.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 6e6 } : undefined);
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    a.download = `${R.slug}-reel.webm`; a.click();
    recorder = null; $("rec").textContent = "Save as video";
    $("note").textContent = "Saved to your downloads as " + a.download + ".";
  };
  recorder.start(500);
  $("rec").textContent = "Stop recording";
  $("note").textContent = "Recording from the start. It stops and saves at the last scene.";
  playing = true; $("play").textContent = "Pause"; go(0);
};

fetch("reel.json").then(r => r.json()).then(d => {
  if (d.error) { $("note").innerHTML = `<span class="err">${d.error}</span>`; return; }
  R = d;
  document.title = `${d.title} reel`;
  $("title").textContent = `${d.title}: the reel`;
  $("sub").textContent = [d.klass && `told by a ${d.klass}`, d.repo].filter(Boolean).join(" · ");
  d.scenes.forEach((sc, i) => { const b = document.createElement("button"); b.textContent = `${i + 1}. ${sc.title || sc.kind}`; b.onclick = () => go(i); $("scenes").appendChild(b); });
  go(0);
});
requestAnimationFrame(frame);
</script>
</body></html>
