<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · war table</title>
<style>
  :root {
    --bg: #0f1117; --panel: #161922; --line: #242835; --text: #e6e8ef; --dim: #9aa3b8;
    --accent: #7aa2f7; --ok: #7dcfa0; --warn: #e0af68; --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7fa; --panel: #ffffff; --line: #e2e5ec; --text: #1b1f2a; --dim: #5c6478; --accent: #3a63c8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .quest { margin-left: auto; color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }
  main { flex: 1; display: flex; min-height: 0; }
  iframe { flex: 1; border: 0; background: var(--bg); }
  aside { width: 400px; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .scroll { overflow-y: auto; padding: 14px; flex: 1; }
  .q { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .q h3 { margin: 0 0 4px; font-size: 13px; }
  .q p.detail { margin: 0 0 10px; color: var(--dim); font-size: 12px; }
  label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; }
  label.opt:hover { background: rgba(122,162,247,.08); }
  label.opt.chosen { border-color: var(--accent); background: rgba(122,162,247,.12); }
  label.opt img { width: 64px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  label.opt .lab { font-weight: 500; }
  label.opt .why { color: var(--dim); font-size: 12px; }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--warn); margin-left: 6px; }
  textarea { width: 100%; min-height: 90px; resize: vertical; background: var(--bg); color: var(--text);
             border: 1px solid var(--line); border-radius: 8px; padding: 9px; font: inherit; }
  .shots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .shots img { width: 58px; height: 42px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  footer { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; gap: 8px; align-items: center; }
  button { font: inherit; border-radius: 8px; padding: 8px 12px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d12; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--dim); font-size: 11px; }
  .sent { color: var(--ok); font-size: 12px; }
  @media (max-width: 900px) { main { flex-direction: column; } aside { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 55vh; } }
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1><span class="sub">{{SUBTITLE}}</span>
  <span class="quest">quest {{QUEST}}</span>
</header>
<main>
  <iframe src="content.html" title="analysis"></iframe>
  <aside>
    <div class="scroll">
      <div id="questions"></div>
      <textarea id="message" placeholder="Anything else for the adventurer? Paste or drop images here."></textarea>
      <div class="shots" id="shots"></div>
      <p class="hint">Images are saved next to the board, on this machine only.</p>
    </div>
    <footer>
      <button class="primary" id="send">Send</button>
      <button id="sendEnd">Send &amp; end</button>
      <span id="state" class="hint"></span>
    </footer>
  </aside>
</main>
<script>
const QUESTIONS = {{QUESTIONS}};
const answers = {}, attachments = [];
const el = (t, c) => { const n = document.createElement(t); if (c) n.className = c; return n; };

function draw() {
  const root = document.getElementById("questions");
  root.innerHTML = "";
  for (const q of QUESTIONS) {
    const box = el("div", "q");
    const h = el("h3"); h.textContent = q.title; box.appendChild(h);
    if (q.detail) { const p = el("p", "detail"); p.textContent = q.detail; box.appendChild(p); }
    if (q.type === "text") {
      const t = el("textarea");
      t.placeholder = q.placeholder || "your answer";
      t.oninput = () => { answers[q.id] = t.value; };
      box.appendChild(t);
    } else {
      for (const o of q.options || []) {
        const lab = el("label", "opt");
        const input = el("input");
        input.type = q.type === "multi" ? "checkbox" : "radio";
        input.name = q.id;
        input.onchange = () => {
          if (q.type === "multi") {
            const set = new Set(answers[q.id] || []);
            input.checked ? set.add(o.id) : set.delete(o.id);
            answers[q.id] = [...set];
          } else {
            answers[q.id] = o.id;
          }
          for (const s of box.querySelectorAll("label.opt")) s.classList.remove("chosen");
          if (q.type === "multi") {
            for (const s of box.querySelectorAll("label.opt")) if (s.querySelector("input").checked) s.classList.add("chosen");
          } else lab.classList.add("chosen");
        };
        lab.appendChild(input);
        if (o.image) { const img = el("img"); img.src = o.image; lab.appendChild(img); }
        const txt = el("div");
        const name = el("div", "lab");
        name.textContent = o.label;
        if (q.recommended === o.id) { const t = el("span", "tag"); t.textContent = "suggested"; name.appendChild(t); }
        txt.appendChild(name);
        if (o.why) { const w = el("div", "why"); w.textContent = o.why; txt.appendChild(w); }
        lab.appendChild(txt);
        box.appendChild(lab);
      }
    }
    root.appendChild(box);
  }
}

async function upload(file) {
  const data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
  const r = await fetch("upload", { method: "POST", body: JSON.stringify({ name: file.name, data }) });
  const { path } = await r.json();
  attachments.push(path);
  const img = el("img"); img.src = path; document.getElementById("shots").appendChild(img);
}

const box = document.getElementById("message");
box.addEventListener("paste", e => { for (const it of e.clipboardData.files) upload(it); });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); for (const f of e.dataTransfer.files) upload(f); });

async function send(ended) {
  const missing = QUESTIONS.filter(q => q.required !== false && answers[q.id] === undefined);
  if (missing.length && !confirm(`${missing.length} question(s) not answered. Send anyway?`)) return;
  document.getElementById("send").disabled = document.getElementById("sendEnd").disabled = true;
  await fetch("reply", { method: "POST", body: JSON.stringify({ answers, message: box.value, attachments, ended }) });
  document.getElementById("state").innerHTML = '<span class="sent">sent, the adventurer is working on it</span>';
}
document.getElementById("send").onclick = () => send(false);
document.getElementById("sendEnd").onclick = () => send(true);

fetch("state.json").then(r => r.json()).then(s => {
  if (!s.answered) return;
  document.getElementById("send").disabled = document.getElementById("sendEnd").disabled = true;
  document.getElementById("state").innerHTML = '<span class="sent">already answered at ' + s.decision.at + '</span>';
});
draw();
</script>
</body>
</html>
