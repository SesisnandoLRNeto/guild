<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · war table</title>
<style>
  /* The guild look: a dark wood table, the report as a parchment sheet in the middle,
     and your orders on parchment cards on the right. */
  :root {
    --wood: #22170f; --wood-2: #2a1d14; --grain: #1a110b; --sign: #5b3e28; --sign-text: #f3e2bd; --hint: #c9b08a;
    --paper: #f3e7c9; --paper-2: #e6d5ad; --ink: #2d2216; --ink-dim: #6e5a41; --rule: #cdb88e;
    --gold: #d9a441; --seal: #a8322a; --ok: #3f7d3a; --radius: 4px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; color: var(--ink);
         background-color: var(--wood);
         background-image: repeating-linear-gradient(0deg, var(--wood-2) 0 46px, var(--grain) 46px 48px, var(--wood) 48px 94px, var(--grain) 94px 96px);
         font: 14px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 12px 20px 11px; background: var(--sign); color: var(--sign-text);
           box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25), 0 3px 8px rgba(0, 0, 0, .4); position: relative; z-index: 1; }
  header .mark { font-variant: small-caps; letter-spacing: .08em; color: var(--gold); font-weight: 700; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; font-variant: small-caps; letter-spacing: .03em; }
  header .sub { color: var(--hint); font-size: 13px; font-style: italic; }
  header .quest { margin-left: auto; color: var(--hint); font-size: 12px; font-family: ui-monospace, monospace; }
  main { flex: 1; display: flex; min-height: 0; }
  iframe { flex: 1; border: 0; background: transparent; }
  aside { width: 400px; display: flex; flex-direction: column; min-height: 0; background: rgba(0, 0, 0, .28);
          border-left: 2px solid #4a3322; box-shadow: inset 0 0 24px rgba(0, 0, 0, .35); }
  .orders { margin: 0; padding: 14px 16px 6px; color: var(--sign-text); font-variant: small-caps; letter-spacing: .06em; font-size: 15px; }
  .orders span { display: block; font-variant: normal; letter-spacing: 0; font-style: italic; color: var(--hint); font-size: 12px; }
  .scroll { overflow-y: auto; padding: 6px 16px 14px; flex: 1; }
  .q { background: linear-gradient(170deg, var(--paper), var(--paper-2)); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px;
       box-shadow: 0 2px 0 rgba(0, 0, 0, .15), 0 6px 14px rgba(0, 0, 0, .35); }
  .q h3 { margin: 0 0 4px; font-size: 15px; font-variant: small-caps; letter-spacing: .02em; color: #4a2f1a; }
  .q p.detail { margin: 0 0 10px; color: var(--ink-dim); font-size: 13px; }
  label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; position: relative; }
  label.opt:hover { background: rgba(217, 164, 65, .14); }
  label.opt.chosen { border-color: var(--gold); background: rgba(217, 164, 65, .22); }
  label.opt.chosen::after { content: ""; position: absolute; right: 8px; top: 8px; width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e86a5c, var(--seal) 60%, #6d1a13); box-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
  label.opt input { accent-color: var(--seal); margin-top: 3px; }
  label.opt img { width: 64px; height: 44px; object-fit: cover; border-radius: 3px; border: 1px solid var(--rule); }
  label.opt .lab { font-weight: 700; }
  label.opt .why { color: var(--ink-dim); font-size: 12px; }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #fff5dc; background: var(--seal);
         border-radius: 3px; padding: 1px 6px; margin-left: 6px; }
  textarea { width: 100%; min-height: 90px; resize: vertical; background: linear-gradient(170deg, var(--paper), var(--paper-2)); color: var(--ink);
             border: 1px solid var(--rule); border-radius: 4px; padding: 10px; font: inherit; box-shadow: inset 0 1px 3px rgba(60, 40, 20, .2); }
  textarea::placeholder { color: var(--ink-dim); font-style: italic; }
  .shots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .shots img { width: 58px; height: 42px; object-fit: cover; border-radius: 3px; border: 1px solid var(--rule); }
  footer { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--sign); box-shadow: 0 -3px 8px rgba(0, 0, 0, .3); }
  footer button { white-space: nowrap; }
  footer #state { flex-basis: 100%; }
  button { font: inherit; border-radius: 4px; padding: 8px 14px; border: 1px solid var(--hint); background: transparent; color: var(--sign-text); cursor: pointer; }
  button:hover { border-color: var(--gold); color: var(--gold); }
  button.primary { background: var(--gold); border-color: var(--gold); color: #2a1d14; font-weight: 700; }
  button.primary:hover { background: #e6b75a; color: #2a1d14; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--hint); font-size: 11px; font-style: italic; }
  .sent { color: #a6e3a1; font-size: 12px; }
  @media (max-width: 900px) { main { flex-direction: column; } aside { width: auto; border-left: 0; border-top: 2px solid #4a3322; max-height: 55vh; } }
</style>
</head>
<body>
<header>
  <span class="mark">War table</span><h1>{{TITLE}}</h1><span class="sub">{{SUBTITLE}}</span>
  <span class="quest">quest {{QUEST}}</span>
</header>
<main>
  <iframe src="content.html" title="analysis"></iframe>
  <aside>
    <h2 class="orders">Your orders<span>The adventurer waits for these before moving on.</span></h2>
    <div class="scroll">
      <div id="questions"></div>
      <textarea id="message" placeholder="Anything else for the adventurer? Paste or drop images here."></textarea>
      <div class="shots" id="shots"></div>
      <p class="hint">Images are saved next to the board, on this machine only.</p>
    </div>
    <footer>
      <button class="primary" id="send">Send orders</button>
      <button id="sendEnd">Send &amp; end</button>
      <span id="state" class="hint"></span>
    </footer>
  </aside>
</main>
<script>
const QUESTIONS = {{QUESTIONS}};
const answers = {}, attachments = [];
const el = (t, c) => { const n = document.createElement(t); if (c) n.className = c; return n; };

function draw() {
  const root = document.getElementById("questions");
  root.innerHTML = "";
  for (const q of QUESTIONS) {
    const box = el("div", "q");
    const h = el("h3"); h.textContent = q.title; box.appendChild(h);
    // The page on the left explains the question; the panel is only where you choose.
    // Repeating the detail here is what made a board read twice on a narrow window.
    if (q.type === "text") {
      const t = el("textarea");
      t.placeholder = q.placeholder || "your answer";
      t.oninput = () => { answers[q.id] = t.value; };
      box.appendChild(t);
    } else {
      for (const o of q.options || []) {
        const lab = el("label", "opt");
        const input = el("input");
        input.type = q.type === "multi" ? "checkbox" : "radio";
        input.name = q.id;
        input.onchange = () => {
          if (q.type === "multi") {
            const set = new Set(answers[q.id] || []);
            input.checked ? set.add(o.id) : set.delete(o.id);
            answers[q.id] = [...set];
          } else {
            answers[q.id] = o.id;
          }
          for (const s of box.querySelectorAll("label.opt")) s.classList.remove("chosen");
          if (q.type === "multi") {
            for (const s of box.querySelectorAll("label.opt")) if (s.querySelector("input").checked) s.classList.add("chosen");
          } else lab.classList.add("chosen");
        };
        lab.appendChild(input);
        if (o.image) { const img = el("img"); img.src = o.image; lab.appendChild(img); }
        const txt = el("div");
        const name = el("div", "lab");
        name.textContent = o.label;
        if (q.recommended === o.id) { const t = el("span", "tag"); t.textContent = "suggested"; name.appendChild(t); }
        txt.appendChild(name);
        if (o.why) lab.title = o.why;   // the reason is on the page; here it is a hover hint
        lab.appendChild(txt);
        box.appendChild(lab);
      }
    }
    root.appendChild(box);
  }
}

async function upload(file) {
  const data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
  const r = await fetch("upload", { method: "POST", body: JSON.stringify({ name: file.name, data }) });
  const { path } = await r.json();
  attachments.push(path);
  const img = el("img"); img.src = path; document.getElementById("shots").appendChild(img);
}

const box = document.getElementById("message");
box.addEventListener("paste", e => { for (const it of e.clipboardData.files) upload(it); });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); for (const f of e.dataTransfer.files) upload(f); });

async function send(ended) {
  const missing = QUESTIONS.filter(q => q.required !== false && answers[q.id] === undefined);
  if (missing.length && !confirm(`${missing.length} question(s) not answered. Send anyway?`)) return;
  document.getElementById("send").disabled = document.getElementById("sendEnd").disabled = true;
  await fetch("reply", { method: "POST", body: JSON.stringify({ answers, message: box.value, attachments, ended }) });
  document.getElementById("state").innerHTML = '<span class="sent">sent, the adventurer is working on it</span>';
}
document.getElementById("send").onclick = () => send(false);
document.getElementById("sendEnd").onclick = () => send(true);

fetch("state.json").then(r => r.json()).then(s => {
  if (!s.answered) return;
  document.getElementById("send").disabled = document.getElementById("sendEnd").disabled = true;
  document.getElementById("state").innerHTML = '<span class="sent">already answered at ' + s.decision.at + '</span>';
});
draw();
</script>
</body>
</html>
