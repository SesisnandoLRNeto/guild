# The guild cockpit.
#
# This config is only ever loaded by `guild up`, which runs its own tmux server on the
# socket "guild" (tmux -L guild). Your normal tmux keeps its own server, config and keys.
# Attach by hand with: tmux -L guild attach -t guild

set -g prefix C-g
unbind C-b
bind C-g send-prefix

set -g mouse on
set -g base-index 0
set -g renumber-windows on
set -g history-limit 20000
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc"

# Colors: Catppuccin Mocha, the palette claude-deck uses, so the cockpit reads as one tool.
# Status bar: one tab per quest, each a button you can click. `guild watch` marks a tab when
# its quest wants you. On the right, buttons you can click too.
set -g status-position top                  # the tab strip sits above the content, like herdr
set -g status-interval 5
set -g status-style "bg=#313244,fg=#a6adc8"
# Every pane on the deck's surface color, blue-grey instead of terminal black.
set -g window-style "bg=#1e1e2e"
set -g window-active-style "bg=#1e1e2e"
set -g status-left " #[bold,fg=#89b4fa]guild#[default] "
set -g status-left-length 20
set -g status-right "#[range=user|newtab]#[fg=#1e1e2e,bg=#a6e3a1,bold] +claude #[norange]#[default] #[range=user|newterm]#[fg=#1e1e2e,bg=#89b4fa,bold] +term #[norange]#[default] #[range=user|campaign]#[fg=#1e1e2e,bg=#fab387,bold] board #[norange]#[default] #[range=user|pins]#[fg=#1e1e2e,bg=#cba6f7,bold] pins #[norange]#[default]  #[fg=#6c7086]#(guild roster --count)  %H:%M "
set -g status-right-length 140
setw -g window-status-format "#[fg=#bac2de,bg=#45475a] #I #W#{?@guildstate,#[fg=#f9e2af]#{@guildstate},} #[default]"
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I #W#{?@guildstate,#{@guildstate},} #[default]"
setw -g window-status-separator " "
# Every tab has the side menu at the same width, so switching tabs changes only the content.
set-hook -g client-resized 'run-shell "guild layout"'

set -g pane-border-style "fg=#585b70,bg=#1e1e2e"
set -g pane-active-border-style "fg=#a6e3a1,bg=#1e1e2e"     # the focused pane is green, like the deck's
set -g message-style "bg=#89b4fa,fg=#1e1e2e"
set -g menu-style "bg=#1e1e2e,fg=#cdd6f4"
set -g menu-selected-style "bg=#89b4fa,fg=#1e1e2e"
set -g menu-border-style "fg=#585b70"

# Keys. Press Ctrl-g, then the letter. Keeping Ctrl held for the letter works too
# (Ctrl-g Ctrl-k is the same as Ctrl-g k), so it is one hand, one motion.
# On a quest tab, edit that quest's worktree; anywhere else, open the work root.
bind e run-shell "guild edit '#W' 2>/dev/null || guild edit"
bind C-e run-shell "guild edit '#W' 2>/dev/null || guild edit"
bind E command-prompt -p "edit what (quest, folder or file):" "run-shell 'guild edit %1'"
bind g run-shell "guild docket >/dev/null"   # the docket: every open decision, one page
bind w choose-tree -Zw                      # jump to a tab from a list
bind C-w choose-tree -Zw
bind = run-shell "guild layout"             # put the sidebar back to its size
bind n run-shell "guild new '#{pane_current_path}'"            # a new Claude tab, in this folder
bind C-n run-shell "guild new '#{pane_current_path}'"
bind N command-prompt -p "new Claude tab in folder:" "run-shell 'guild new %1'"
bind t run-shell "guild term '#{pane_current_path}'"          # a terminal tab, same side menu
bind C-t run-shell "guild term '#{pane_current_path}'"
bind b run-shell "guild campaign >/dev/null"                   # the campaign board (k too)
bind C-b run-shell "guild campaign >/dev/null"
bind k run-shell "guild campaign >/dev/null"
bind C-k run-shell "guild campaign >/dev/null"
bind p run-shell "guild pin '#W' '#{client_name}'"             # pin or unpin this tab
bind C-p run-shell "guild pin '#W' '#{client_name}'"
bind P run-shell "guild pins menu '#{client_name}'"            # jump to a pinned session
bind Left previous-window
bind C-Left previous-window
bind Right next-window
bind C-Right next-window
bind C-h select-pane -L                      # Ctrl-g Ctrl-h: to the sidebar
bind C-l select-pane -R                      # Ctrl-g Ctrl-l: back to the quartermaster
# Ctrl-g ? (or Ctrl-g Space): every action in a menu. Pick with the letter or click it.
bind ? display-menu -T "#[bold] guild " -x C -y C \
  "New Claude tab"      n "run-shell \"guild new '#{pane_current_path}'\"" \
  "New terminal tab"    t "run-shell \"guild term '#{pane_current_path}'\"" \
  "Campaign board"      b "run-shell 'guild campaign >/dev/null'" \
  "Docket (decisions)"  g "run-shell 'guild docket >/dev/null'" \
  "" \
  "Pin or unpin tab"    p "run-shell \"guild pin '#W' '#{client_name}'\"" \
  "Pinned sessions"     P "run-shell \"guild pins menu '#{client_name}'\"" \
  "Pick a tab"          w "choose-tree -Zw" \
  "" \
  "Edit this quest"     e "run-shell \"guild edit '#W' 2>/dev/null || guild edit\"" \
  "Edit a file"         E "command-prompt -p 'edit what (quest, folder or file):' \"run-shell 'guild edit %1'\"" \
  "Reset the sidebar"   = "run-shell 'guild layout'" \
  "Detach"              d detach-client
bind Space display-menu -T "#[bold] guild " -x C -y C \
  "New Claude tab"      n "run-shell \"guild new '#{pane_current_path}'\"" \
  "New terminal tab"    t "run-shell \"guild term '#{pane_current_path}'\"" \
  "Campaign board"      b "run-shell 'guild campaign >/dev/null'" \
  "Docket (decisions)"  g "run-shell 'guild docket >/dev/null'" \
  "" \
  "Pin or unpin tab"    p "run-shell \"guild pin '#W' '#{client_name}'\"" \
  "Pinned sessions"     P "run-shell \"guild pins menu '#{client_name}'\"" \
  "Pick a tab"          w "choose-tree -Zw" \
  "" \
  "Edit this quest"     e "run-shell \"guild edit '#W' 2>/dev/null || guild edit\"" \
  "Edit a file"         E "command-prompt -p 'edit what (quest, folder or file):' \"run-shell 'guild edit %1'\"" \
  "Reset the sidebar"   = "run-shell 'guild layout'" \
  "Detach"              d detach-client
# Clicks on the status bar: the buttons on the right, or a tab to switch to it.
# One flat check: a nested if-shell loses the mouse, so the buttons would stop working.
bind -n MouseDown1Status if-shell -F "#{m/r:^(newtab|newterm|campaign|pins)$,#{mouse_status_range}}" \
  "run-shell \"guild click '#{mouse_status_range}' '#{client_name}' '#{pane_current_path}'\"" "select-window -t ="
bind r refresh-client
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-Left previous-window              # Alt keys work only when the terminal sends Option as Meta
bind -n M-Right next-window
bind -r Left resize-pane -L 3
bind -r Right resize-pane -R 3
