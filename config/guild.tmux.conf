# The guild cockpit.
#
# This config is only ever loaded by `guild up`, which runs its own tmux server on the
# socket "guild" (tmux -L guild). Your normal tmux keeps its own server, config and keys.
# Attach by hand with: tmux -L guild attach -t guild

set -g prefix C-g
unbind C-b
bind C-g send-prefix

set -g mouse on
set -g base-index 0
set -g renumber-windows on
set -g history-limit 20000
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc"

# Status bar: one tab per quest. `guild watch` marks a tab when its quest wants you.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#161922,fg=#9aa3b8"
set -g status-left " #[bold,fg=#7aa2f7]guild#[default] "
set -g status-left-length 20
# "+ claude" is clickable: it opens a new Claude tab. The rest is the fleet's numbers.
set -g status-right "#[range=user|newtab]#[fg=#0f1117,bg=#7dcfa0,bold] + claude #[norange]#[default]  #[fg=#9aa3b8]#(guild roster --count)  %H:%M "
set -g status-right-length 80
setw -g window-status-format " #I #W#{?@guildstate,#{@guildstate},} "
setw -g window-status-current-format " #[fg=#0f1117,bg=#7aa2f7,bold] #I #W#{?@guildstate,#{@guildstate},} #[default] "
setw -g window-status-separator ""
# The sidebar keeps a fixed width when you resize the terminal.
set-hook -g client-resized 'run-shell "guild layout"' 

set -g pane-border-style "fg=#242835"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#0f1117"

# Keys (prefix is Ctrl-g)
# On a quest tab, edit that quest's worktree; anywhere else, open the work root.
bind e run-shell "guild edit '#W' 2>/dev/null || guild edit"
bind E command-prompt -p "edit what (quest or path):" "run-shell 'guild edit %1'"
bind g run-shell "guild board url | head -1 | xargs -r open"   # open the war table
bind w choose-tree -Zw                      # jump to a quest
bind = run-shell "guild layout"             # put the sidebar back to its size
bind n run-shell "guild new '#{pane_current_path}'"            # a new Claude tab, in this folder
bind N command-prompt -p "new Claude tab in folder:" "run-shell 'guild new %1'"
# A click on "+ claude" opens a tab; a click anywhere else on the bar keeps its usual meaning.
bind -n MouseDown1Status if-shell -F "#{==:#{mouse_status_range},newtab}" "run-shell 'guild new'" "select-window -t ="
bind r refresh-client
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -r Left resize-pane -L 3
bind -r Right resize-pane -R 3
